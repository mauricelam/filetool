[package]
name = "dmg-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
apple-dmg = "0.2.0"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
tsify = "0.4"
uuid = { version = "1.19.0", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
opt-level = "s"
