name: Node.js CI

env:
  CARGO_TERM_COLOR: always
  TURBO_CACHE_DIR: .turbo

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      statuses: write
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      pull-requests: write

    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "4.0.22"
          actions-cache-folder: "emsdk-cache"

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            protoscope/go.sum
            dexviewer/godexviewer/go.sum
            der/wasm/go.sum

      - name: Rust Target
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Cache Turbo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: npm run build
        id: build
      - run: npm test
      - run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:integration
      - run: npm run zip-dist
        if: github.ref == 'refs/heads/main'

      - name: Build PR preview
        if: github.event_name == 'pull_request'
        run: |
          rm -rf dist/ffmpeg
          SKIP_HANDLERS=ffmpeg npm run build -- --filter=!@filetool/ffmpeg
        env:
          SKIP_HANDLERS: ffmpeg

      - name: Prepare for deployment
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          mkdir -p cloudflare-deploy/filetool
          cp -r dist/* cloudflare-deploy/filetool/
          cat <<EOF > cloudflare-deploy/_headers
          /filetool/ffmpeg/*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF
          cat <<EOF > cloudflare-deploy/_redirects
          / /filetool/ 302
          EOF

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-deploy --project-name=filetool --branch=${{ github.head_ref }} --commit-dirty=true

      - name: Set Preview Status Check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              target_url: "${{ steps.deploy.outputs.deployment-url }}/filetool/",
              description: 'Cloudflare Pages preview is ready!',
              context: 'deploy/cloudflare-pages'
            });

      - name: Comment on PR if secrets are missing
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '') && github.event.action == 'opened' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Cloudflare Pages preview deployment was skipped because `CLOUDFLARE_API_TOKEN` or `CLOUDFLARE_ACCOUNT_ID` are not configured in repository secrets.'
            })

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
