<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DEX viewer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            line-height: 1.5;
            height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
            gap: 16px;
            flex-shrink: 0;
        }

        .search-container {
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .proguard-uploader-compact {
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .proguard-uploader-compact label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #f9fafb;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            color: #374151;
            font-weight: 500;
        }

        .proguard-uploader-compact label:hover {
            border-color: #2563eb;
            background: #f3f4f6;
            color: #2563eb;
        }

        .proguard-uploader-compact input[type="file"] {
            display: none;
        }

        .proguard-icon {
            width: 16px;
            height: 16px;
        }

        .package-tree {
            background: white;
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .package-node {
            margin: 2px 0;
        }

        .package-header {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .package-header:hover {
            background-color: #f0f0f0;
        }

        .package-icon {
            margin-right: 8px;
            font-size: 14px;
            width: 16px;
            text-align: center;
        }

        .package-name {
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .package-count {
            margin-left: 8px;
            font-size: 12px;
            color: #9ca3af;
            font-weight: normal;
        }

        .package-content {
            border-left: 1px solid #e5e7eb;
            margin-left: 15px;
            padding-left: 8px;
            margin-top: 2px;
        }

        .dexclass {
            margin: 4px 0;
            border-radius: 4px;
            background: #fff;
        }

        .class-header {
            display: flex;
            flex-direction: column;
            padding: 8px;
            cursor: pointer;
            transition: background-color 0.1s ease;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .class-header:hover {
            background-color: #f9fafb;
            border-color: #e5e7eb;
        }

        .class-signature {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            color: #374151;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .keyword {
            color: #2563eb;
        }

        .type-name {
            color: #0d9488;
        }

        .brace {
            color: #4b5563;
            font-weight: bold;
        }

        .class-annotations {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-left: 4px;
            margin-bottom: 2px;
        }

        .annotation {
            color: #6b7280;
            font-style: italic;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 12px;
        }

        .dots-button {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
            padding: 0 12px;
            line-height: 1;
            transition: color 0.2s;
            margin-left: 24px;
        }

        .dots-button:hover {
            color: #4b5563;
        }

        .method {
            margin: 1px 0;
        }

        .method-header {
            cursor: pointer;
            padding: 4px 8px 4px 32px;
            display: flex;
            align-items: center;
            transition: background-color 0.1s ease;
            border-radius: 4px;
            gap: 4px;
        }

        .method-header,
        .method-content {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 12px;
            color: #374151;
        }

        .method-header:hover {
            background-color: #f3f4f6;
        }

        .access-flags {
            color: #2563eb;
        }

        .method-name {
            color: #374151;
        }

        .instruction-line {
            padding: 1px 0;
        }

        .loading {
            color: #9ca3af;
            font-style: italic;
            padding: 4px 24px;
            font-size: 12px;
        }

        #output {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .field {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 12px;
            color: #374151;
            padding: 2px 8px 2px 32px;
        }

        .method-content {
            padding-left: 48px !important;
        }
    </style>
</head>

<body>
    <div id="output"></div>
</body>
<script type="module" src="main.js"></script>
<script type="module" src="wasm_exec.js"></script>

</html>
