[package]
name = "archive-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = "0.4.5"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["default_wasm"] }
cpio = "0.2"
getrandom = { version = "0.2.15", features = ["js"] }

[patch.crates-io]
getrandom = { git = "https://github.com/rust-random/getrandom", rev = "v0.2.15" }
