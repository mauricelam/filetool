<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File tool</title>
    <style>
        html {
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
            background-color: #eee;
        }

        body {
            display: flex;
            margin: 0;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        nav {
            padding: 8px;
            background-color: #1f225a;
            color: #fff;
        }

        #logo {
            padding: 8px;
        }

        #title {
            font-size: 30px;
            font-family: 'Georgia', serif;
        }

        #subtitle {
            color: #ccc;
        }

        #basicinfo {
            display: flex;
            flex-direction: row;
            justify-content: center;
            max-height: 300px;
            flex-shrink: 1;
            flex-grow: 1;
            padding: 8px;
        }

        #result {
            padding: 0 12px;
            overflow: auto;
            position: relative;
        }

        #droptarget {
            min-width: 200px;
            max-width: 512px;
            height: 100%;
            border: 2px dashed #666;
            border-radius: 10px;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            flex-grow: 1;
            cursor: pointer;
            box-sizing: border-box;
            flex-direction: column;
        }

        #droptarget:hover {
            background-color: #ddd;
        }

        #droptarget:active {
            background-color: #ccc;
        }

        #droptarget.dropover {
            border: 2px dashed #285c20;
            background-color: #ccc;
        }

        #droptarget * {
            pointer-events: none;
        }

        #result:not(:empty) {
            flex-grow: 999;
        }

        #framecontainer {
            flex-grow: 100;
        }

        #framecontainer:empty {
            display: none;
        }

        iframe {
            border: 0;
            width: 100%;
            height: 100%;
        }

        #info-toggle {
            cursor: pointer;
            padding: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        #info-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .collapsed #basicinfo {
            display: none;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: padding 0.2s;
        }

        .collapsed nav {
            padding: 4px 8px;
        }

        .collapsed #logo {
            padding: 0;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .collapsed #title {
            font-size: 20px;
        }

        .collapsed #subtitle {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <div id="framecontainer"></div>
    <input type="file" id="fileinput" style="display: none;" multiple />
</body>
<script src="main.js" type="module"></script>

</html>
