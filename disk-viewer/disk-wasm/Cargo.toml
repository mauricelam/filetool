[package]
name = "disk-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fstool = { version = "0.5.0", default-features = false, features = ["std", "filesystems"] }
dmg-core = "0.1.5"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = "0.4"

[profile.release]
lto = true
opt-level = "s"
