<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Viewer</title>
    <style>
        html, body, #output {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #525659;
        }

        .pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .pdf-page {
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            background-color: white;
        }

        canvas {
            display: block;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div id="output"></div>
</body>
<script type="module" src="main.js"></script>
</html>
