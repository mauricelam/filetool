[package]
name = "hprof-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jvm-hprof = "0.1.0"
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.70", features = ["console"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
once_cell = "1.19"
log = "0.4.20"
