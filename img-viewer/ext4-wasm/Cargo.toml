[package]
name = "ext4-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ext4-view = "0.9.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tsify = "0.4"

[profile.release]
lto = true
opt-level = "s"
