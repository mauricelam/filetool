<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Open XML Viewer</title>
    <style>
        html, body, #output {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .error-message {
            color: #d32f2f;
            padding: 16px;
            background-color: #fde8e8;
            border-bottom: 1px solid #f8b4b4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="output"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
