[package]
name = "abxml-wasm-common"
version = "0.1.0"
edition = "2021"

[dependencies]
abxml = { path = "../abxml-rs" }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
tsify = "0.5.6"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_json = "1.0"
anyhow = "1.0.87"
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2.15", features = ["js"] }
