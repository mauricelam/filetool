[package]
name = "proguard-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
proguard = "5.6.2"
console_error_panic_hook = { version = "0.1.7", optional = true }
web-sys = { version = "0.3.69", features = ["console"] }
regex = "1.10.5"

[features]
default = ["console_error_panic_hook"]
