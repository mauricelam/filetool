<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEX viewer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            line-height: 1.5;
        }

        .package-tree {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 16px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .package-node {
            margin: 4px 0;
        }

        .package-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .package-header:hover {
            background-color: #f0f0f0;
        }

        .package-icon {
            margin-right: 8px;
            font-size: 16px;
        }

        .package-name {
            font-weight: 600;
            color: #2563eb;
            font-size: 14px;
        }

        .package-count {
            margin-left: auto;
            font-size: 12px;
            color: #6b7280;
            font-weight: normal;
        }

        .package-content {
            border-left: 2px solid #e5e7eb;
            margin-left: 20px;
            padding-left: 12px;
            margin-top: 4px;
        }

        .dexclass {
            margin: 4px 0;
            border-radius: 6px;
            background: #fafafa;
            border: 1px solid #e5e7eb;
        }

        .class-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .class-header:hover {
            background-color: #f3f4f6;
        }


        .membername {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-weight: 500;
            color: #374151;
            font-size: 13px;
        }

        .method-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            font-weight: normal;
        }

        .dexclass > .class-header::before {
            content: "▶ ";
            width: 16px;
            display: inline-block;
            font-size: 10px;
            color: #9ca3af;
            transition: transform 0.2s ease;
        }

        .dexclass.expanded > .class-header::before {
            content: "▼ ";
            transform: rotate(0deg);
        }

        .method {
            margin: 2px 0;
            background: white;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
        }

        .method > .membername {
            cursor: pointer;
            padding: 8px 12px;
            display: block;
            transition: background-color 0.2s ease;
        }

        .method > .membername:hover {
            background-color: #f9fafb;
        }

        .method-header {
            cursor: pointer;
            padding: 8px 12px;
            display: block;
            transition: background-color 0.2s ease;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 12px;
            color: #374151;
        }

        .method-header:hover {
            background-color: #f9fafb;
        }

        .method-header::before {
            content: "▶ ";
            width: 16px;
            display: inline-block;
            font-size: 10px;
            color: #9ca3af;
            transition: transform 0.2s ease;
        }

        .method.expanded > .method-header::before {
            content: "▼ ";
        }

        .method-signature {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 12px;
            color: #374151;
        }

        .access-flags {
            color: #7c3aed;
            font-weight: 500;
            margin-right: 4px;
        }

        .method-name {
            color: #059669;
        }

        .instruction {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            color: #374151;
            padding: 4px 16px;
            font-size: 12px;
            background: #f8f9fa;
            border-top: 1px solid #e5e7eb;
            margin: 0;
        }

        .instruction:nth-child(even) {
            background: #f1f3f4;
        }

        .loading {
            color: #6b7280;
            font-style: italic;
            padding: 8px 16px;
            font-size: 12px;
        }

        /* Proguard uploader styling */
        label {
            display: block;
            margin-bottom: 16px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            border: 2px dashed #d1d5db;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        label:hover {
            border-color: #2563eb;
        }

        input[type="file"] {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="output"></div>
</body>
<script type="module" src="main.js"></script>
<script type="module" src="wasm_exec.js"></script>
</html>
