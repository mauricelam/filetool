<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LibreOffice WASM Handler</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c2c2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }
        #qtcanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #status-container {
            position: absolute;
            z-index: 10;
            background: rgba(40, 40, 40, 0.9);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 80%;
        }
        #message {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        #progress-bar {
            width: 280px;
            height: 8px;
            background: #444;
            border-radius: 4px;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #0078d4;
            transition: width 0.2s ease-out;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="status-container">
        <div id="message">Loading LibreOffice...</div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <!-- LibreOffice renders to this canvas -->
    <canvas id="qtcanvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Main handler bridge logic -->
    <script type="module" src="main.js"></script>

    <!-- Load the Emscripten glue code -->
    <!-- The script is loaded as async as recommended for Emscripten pthreads builds -->
    <script async src="/filetool/assets/libreoffice/soffice.js"></script>
</body>
</html>
