<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hex viewer</title>
    <style>
        html, body, #output, #hexviewer {
            height: 100%;
        }

        body {
            background-color: black;
            margin: 0;
        }

        #hexviewer {
            display: flex;
            flex-direction: row;
            justify-content: center;
            color: #ddd;
            line-height: 16px;
        }

        #hex {
            padding: 0 8px;
        }

        #offset {
            color: #888;
        }

        .char_ascii {
            color: #b4d273;
        }

        .char_unknown {
            color: #b05279;
        }

        .hovered {
            background-color: #444;
        }

        .selected {
            background-color: #264f78;
        }

        .marked {
            text-decoration: underline;
            text-decoration-color: #f0ad4e;
            text-decoration-thickness: 2px;
        }

        .marked_length {
            text-decoration-color: #5bc0de;
        }

        .marked_overflow {
            text-decoration-color: #ff0000 !important;
        }

        .preview_marked {
            text-decoration: underline dashed #aaa !important;
            text-decoration-thickness: 2px;
        }

        #inspector {
            width: 300px;
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #inspector h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
        }

        .inspector-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #2d2d2d;
        }

        .inspector-label {
            color: #aaa;
        }

        .inspector-value {
            color: #fff;
            word-break: break-all;
            text-align: right;
            margin-left: 8px;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #1177bb;
        }

        select, input {
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #3c3c3c;
            padding: 2px;
            font-size: 12px;
        }

        .icon-button {
            padding: 2px 4px;
            margin-left: 4px;
            font-size: 10px;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        .marker-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 12px;
            color: #ddd;
        }

        .marker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #2d2d2d;
        }
    </style>
</head>
<body>
    <div id="output"></div>
</body>
<script type="module" src="main.js"></script>
</html>
