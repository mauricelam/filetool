<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File tool</title>
    <style>
        html {
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
            background-color: #eee;
        }

        body {
            margin: 0;
            height: 100%;
        }

        #root {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        nav {
            padding: 8px;
            background-color: #1f225a;
            color: #fff;
        }

        #logo {
            padding: 8px;
        }

        #title {
            font-size: 30px;
            font-family: 'Georgia', serif;
        }

        #subtitle {
            color: #ccc;
        }

        #basicinfo {
            display: flex;
            flex-direction: row;
            justify-content: center;
            max-height: 300px;
            flex-shrink: 1;
            flex-grow: 1;
            padding: 8px;
        }

        #result {
            overflow: auto;
            position: relative;
        }

        #droptarget {
            min-width: 200px;
            max-width: 512px;
            height: 100%;
            border: 2px dashed #666;
            border-radius: 10px;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            flex-grow: 1;
            cursor: pointer;
            box-sizing: border-box;
            flex-direction: column;
            margin: auto;
        }

        #droptarget:hover {
            background-color: #ddd;
        }

        #droptarget:active {
            background-color: #ccc;
        }

        #droptarget.dropover {
            border: 2px dashed #285c20;
            background-color: #ccc;
        }

        #droptarget * {
            pointer-events: none;
        }

        #framecontainer {
            flex-grow: 100;
        }

        #framecontainer:empty {
            display: none;
        }

        iframe {
            border: 0;
            width: 100%;
            height: 100%;
        }

        #info-toggle {
            cursor: pointer;
            padding: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        #info-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .collapsed+#basicinfo {
            display: none;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: padding 0.2s;
        }

        nav.collapsed {
            padding: 4px 8px;
        }

        .collapsed #logo {
            padding: 0;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .collapsed #title {
            font-size: 20px;
        }

        .collapsed #subtitle {
            font-size: 14px;
        }

        .add-file-button {
            margin-top: 8px;
            padding: 8px;
            text-align: center;
            border: 1px dashed #ccc;
            border-radius: 4px;
            cursor: pointer;
            background-color: transparent;
        }

        .add-file-button:hover {
            border-color: #0066cc;
            background-color: #e6f3ff;
        }

        /* Modal styles */
        #modal-root {
            position: relative;
            z-index: 1000;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .modal-close:hover {
            background-color: #f0f0f0;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-group input, .input-group select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 8px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .radio-option.disabled {
            color: #999;
            cursor: not-allowed;
        }

        .radio-option input[type="radio"] {
            margin: 0;
            width: 18px;
            height: 18px;
            cursor: inherit;
        }

        .preview-text {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            border: none;
        }

        .btn-primary {
            background-color: #1f225a;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2c3182;
        }

        .btn-secondary {
            background-color: #ccc;
            color: black;
        }

        .btn-secondary:hover {
            background-color: #bbb;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <div id="modal-root"></div>
</body>
<script src="main.js" type="module"></script>

</html>
